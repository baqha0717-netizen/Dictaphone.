name: Talking Phone APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Talking-Phone/**'
      - '.github/workflows/talking-phone-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: Talking-Phone
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Talking-Phone-debug-apk
          path: Talking-Phone/app/build/outputs/apk/debug/*.apk
